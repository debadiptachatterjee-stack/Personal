<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parth Havle</title>
<meta name="description" content="Parth Havle. Find me on LinkedIn, GitHub or email.">
<style>
  :root {
    --bg: #fafaf9;
    --fg: #16181d;
    --muted: #666b75;
    --line: #dcdde0;
    --accent: #1c47ff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d0f13; --fg: #eceef2; --muted: #8b909b; --line: #262a31; --accent: #8fa8ff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 420px; }
  h1 { margin: 0 0 6px; font-size: 2rem; font-weight: 600; letter-spacing: -.03em; }
  p { margin: 0 0 36px; color: var(--muted); }
  ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 2px; color: var(--fg); text-decoration: none; font-size: 1.05rem;
    transition: color .15s, padding .2s;
  }
  a span { color: var(--muted); transition: transform .2s, color .15s; }
  a:hover, a:focus-visible { color: var(--accent); padding-left: 8px; }
  a:hover span, a:focus-visible span { color: var(--accent); transform: translateX(-4px); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <h1>Parth Havle</h1>
    <p>My full site is on its way. Until then, find me here.</p>
    <ul>
      <!-- Replace the three links below with your own. -->
      <li><a href="https://www.linkedin.com/in/parthhavle" target="_blank" rel="noopener">LinkedIn <span aria-hidden="true">&#8599;</span></a></li>
      <li><a href="https://github.com/parthhavle" target="_blank" rel="noopener">GitHub <span aria-hidden="true">&#8599;</span></a></li>
      <li><a href="mailto: havleparth@gmail.com">Email <span aria-hidden="true">&#8599;</span></a></li>
    </ul>
  </main>
</body>
</html>
